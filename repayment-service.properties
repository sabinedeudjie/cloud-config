server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/microfinancehub_repayment}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:axelle3928}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway desactive
spring.flyway.enabled=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Loan Service URL
loan.service.url=http://localhost:8083

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Token interne
internal.api.token=${INTERNAL_API_TOKEN:my-super-secret-internal-token-2026}

# Penalites
repayment.penalty.rate=0.05
repayment.penalty.grace-period-days=3
repayment.penalty.enabled=true

# Management
management.endpoints.web.exposure.include=health,info,metrics

# Logging
logging.level.org.example.repaymentservice=DEBUG
logging.level.org.springframework.security=INFO
