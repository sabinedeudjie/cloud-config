server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/microfinancehub_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:axelle3928}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Noms des queues/exchanges/routing-keys (utilisés dans RabbitMQConfig et UserLoginEventPublisher)
rabbitmq.queue.user-login=user.login.queue
rabbitmq.exchange.user-events=user.events.exchange
rabbitmq.routing-key.user-login=user.login

# Client Service URL
client.service.url=http://localhost:8081

# Admin par defaut
app.admin.email=${ADMIN_EMAIL:admin@mfh.cm}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Management
management.endpoints.web.exposure.include=health,info,metrics

# Logging
logging.level.org.example.authservice=DEBUG
logging.level.org.springframework.security=INFO
